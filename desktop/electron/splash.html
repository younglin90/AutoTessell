<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --orange: #ff6b2b; --cyan: #7fd4ff; --ink: #d9e9f7; --faint: #52759c; --line: #24466e; }
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background:
          repeating-linear-gradient(0deg, rgba(146,190,230,.05) 0 1px, transparent 1px 24px),
          repeating-linear-gradient(90deg, rgba(146,190,230,.05) 0 1px, transparent 1px 24px),
          #0b2038;
        color: var(--ink);
        font-family: "Consolas", "Malgun Gothic", monospace;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; -webkit-user-select: none; user-select: none;
        border: 1px solid var(--line);
        position: relative;
      }
      /* corner registration marks */
      body::before, body::after {
        content: "+"; position: absolute; color: var(--faint); font-size: 16px;
      }
      body::before { top: 8px; left: 12px; }
      body::after { bottom: 8px; right: 12px; }
      .logo {
        width: 62px; height: 62px; display: grid; place-items: center;
        color: var(--orange); filter: drop-shadow(0 0 14px rgba(255,107,43,.5));
        animation: drift 3.2s ease-in-out infinite;
      }
      @keyframes drift { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .title {
        font-size: 22px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
        color: #f4faff;
      }
      .title b { color: var(--orange); }
      .datum { width: 120px; height: 2px; background: var(--orange); margin-top: -8px; }
      .spinner {
        width: 26px; height: 26px;
        border: 2px solid var(--line); border-top-color: var(--orange);
        transform: rotate(45deg);
        animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(405deg) } }
      #status { font-size: 11px; color: var(--faint); min-height: 15px; letter-spacing: .1em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M3 8l9-5 9 5-9 5-9-5z" />
        <path d="M3 8v8l9 5 9-5V8" opacity="0.55" />
        <path d="M12 13v8" opacity="0.55" />
        <path d="M7.5 5.5l9 5M16.5 5.5l-9 5" opacity="0.3" />
      </svg>
    </div>
    <div class="title">Auto<b>Tessell</b></div>
    <div class="datum"></div>
    <div class="spinner"></div>
    <div id="status">준비 중…</div>
    <script>
      window.__setStatus = function (t) {
        var el = document.getElementById("status");
        if (el) el.textContent = t;
      };
    </script>
  </body>
</html>
