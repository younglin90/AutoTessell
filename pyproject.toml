[build-system]
requires = ["scikit-build-core>=1.0,<2", "pybind11>=3.0.4,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "auto-tessell"
dynamic = ["version"]
description = "CAD/메쉬 파일 → OpenFOAM polyMesh 자동 생성 CLI 도구"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 핵심 CLI
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    # 수치
    "numpy>=2.0",
    "scipy>=1.13",
    # 메쉬 I/O 호환 (v0.4 에서 자체 reader 로 점진 전환 중이지만 legacy 경로
    # 기본값과 file_reader.py 의 다양한 포맷 지원을 위해 아직 유지).
    "trimesh>=4.5",
    # WildMesh axis-section topology and conservative hole-sweep validation.
    # Keep this Python runtime outside the future first-party MIT native core.
    "shapely>=2.1,<3",
    "rtree>=1.4,<2",
    "meshio>=5.3",
    "pyvista>=0.44",
]

# v0.4 native-first: Preprocessor 의 legacy (trimesh/pymeshfix/pyacvd/pymeshlab)
# 경로. `--prefer-native` 로 자체 native_repair / native_remesh 만으로 동작 가능.
# legacy 경로가 필요하면 `pip install auto-tessell[legacy-preprocess]`.

[project.optional-dependencies]
legacy-preprocess = [
    "pymeshfix>=0.16",
    "pyacvd>=0.3",
    "pymeshlab>=2023.12",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-qt>=4.4",
    "httpx>=0.27",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pybind11>=3.0.4,<4",
]
native-build = [
    "pybind11>=3.0.4,<4",
]
cad = [
    "cadquery>=2.4",
]
netgen = [
    "netgen-mesher>=6.2",
]
desktop = [
    "PySide6>=6.8",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
]
volume = [
    "pytetwild>=0.2",
]
ai = [
    "torch>=2.0",
    "meshgpt-pytorch>=1.0",
]
# v0.2: Evaluator 강화
evaluator = [
    "neatmesh>=0.0.8",
    "Ofpp>=0.12",
]
# v0.3: Generator 확장
generator = [
    "meshpy>=2022.1",
    "classy-blocks>=0.6",
]
# v0.4: 케이스 자동화
case = [
    "foamlib>=1.0",
]
# v0.5: 전처리 강화
preprocess = [
    "mesh2sdf>=1.0",
    "fast-simplification>=0.1",
    "sdf>=0.3.7",
]
# 전체 설치 (AI/CAD 제외)
full = [
    "neatmesh>=0.0.8",
    "Ofpp>=0.12",
    "meshpy>=2022.1",
    "foamlib>=1.0",
    "mesh2sdf>=1.0",
    "fast-simplification>=0.1",
    "sdf>=0.3.7",
]

[project.scripts]
auto-tessell = "cli.main:cli"
auto-tessell-qt = "desktop.qt_main:main"

[tool.scikit-build]
cmake.source-dir = "auto_tessell_core"
cmake.build-type = "Release"
wheel.packages = ["cli", "core", "desktop"]
wheel.exclude = [
    "core/generator/native_tet/_native/libtet_kernels.so",
    "core/utils/_shewchuk/*.so",
    "**/__pycache__/**",
    "**/*.pyc",
]
sdist.include = [
    "LICENSE",
    "NOTICE",
    "core/version.py",
    "auto_tessell_core/CMakeLists.txt",
    "auto_tessell_core/native_build_contract.json",
    "auto_tessell_core/native_*_bind.cpp",
    "core/utils/_shewchuk/predicates.c",
    "docs/licensing/distribution-dependency-inventory.json",
    "docs/licensing/evidence/python-wheel-core-cp312-manylinux-x86_64.json",
    "docs/licensing/first-party-native-wheel-profile.md",
    "docs/licensing/mit-core-transition-policy.md",
    "docs/licensing/native-core-provenance-manifest.json",
    "scripts/collect_python_wheel_license_evidence.py",
    "scripts/native_build_evidence.py",
    "scripts/verify_distribution_dependency_inventory.py",
]
sdist.exclude = [
    ".autoresearch/**",
    ".cache/**",
    ".claude/**",
    ".gstack/**",
    "vendor/dependencies/**",
    "docs/contracts/**",
    "products/web/api/**",
    "products/web/reference-ui/**",
    "products/web/app/**",
    "research/quality-harness/**",
    "installer/**",
    "assets/models/**",
    "docs/references/papers/source/**",
    "engines/legacy/tessell_mesh/**",
    "auto_tessell_core/cfmesh_bind.cpp",
    "auto_tessell_core/cinolib_hex_bind.cpp",
    "auto_tessell_core/fake_nanogui/**",
    "auto_tessell_core/ftetwild_bind.cpp",
    "auto_tessell_core/robusthex_bind.cpp",
    "auto_tessell_core/build*/**",
    "**/*.so",
    "**/*.pyd",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.scikit-build.cmake.define]
AUTOTESSELL_INSTALL_FIRST_PARTY_NATIVE = "ON"
BUILD_NATIVE_METRICS = "ON"
BUILD_NATIVE_BL = "ON"
BUILD_NATIVE_POLYMESH = "ON"
BUILD_NATIVE_SNAP = "ON"
BUILD_NATIVE_SURFACE_PADDING = "ON"
BUILD_NATIVE_HEX_QUALITY = "ON"
BUILD_NATIVE_TET_PREDICATES = "ON"
BUILD_NATIVE_TET_QOPT = "ON"
BUILD_CINOLIB_HEX = "OFF"
BUILD_ROBUSTHEX = "OFF"
BUILD_FTETWILD = "OFF"
BUILD_CFMESH = "OFF"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "core/version.py"
regex = '''(?m)^APP_VERSION\s*=\s*["'](?P<value>[^"']+)["']\s*$'''

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_display: marks tests that require a display (skip in headless CI with '-k \"not requires_display\"')",
    "visual: marks GUI screenshot regression tests (skip with --skip-visual)",
    "openfoam: marks tests that require OpenFOAM installation (skip with '-m \"not openfoam\"')",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
